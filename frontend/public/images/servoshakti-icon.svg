<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="60%" stop-color="#0f0c0a" />
      <stop offset="100%" stop-color="#080605" />
    </radialGradient>

    <!-- Amber Shakti Primary Gradient -->
    <linearGradient id="shaktiAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Hot Core Flare -->
    <linearGradient id="energyGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <!-- Metallic Carbon Accent -->
    <linearGradient id="carbonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332a22" />
      <stop offset="50%" stop-color="#1f1812" />
      <stop offset="100%" stop-color="#120e0a" />
    </linearGradient>

    <!-- Shield Rim Border Gradient -->
    <linearGradient id="shieldBorder" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.96  0 0.6 0 0 0.6  0 0 0 0 0.05  0 0 0 0.45 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Container / Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="4" filter="url(#subtleShadow)" />

  <!-- Subtle Precision Tech Outer Ring (Mechanical Servo Dial) -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="176" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 14" />
    <circle cx="256" cy="256" r="192" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="1 8" />
    <!-- 4 Alignment Notches (Precision Service Nodes) -->
    <line x1="256" y1="58" x2="256" y2="72" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="440" x2="256" y2="454" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <line x1="58" y1="256" x2="72" y2="256" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <line x1="440" y1="256" x2="454" y2="256" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central Dynamic "S" Emblem (Geometric Mechanical Servo Wing + Electric Shakti Bolt) -->
  <g filter="url(#glowDrop)">
    <!-- Top Arc / Upper Servo Fin of the "S" -->
    <path d="M 330 134
             C 300 120, 246 116, 204 128
             C 160 141, 136 174, 136 214
             C 136 250, 160 274, 208 290
             L 282 314
             C 324 328, 342 346, 342 374
             C 342 414, 304 438, 248 438
             C 212 438, 172 426, 142 404
             L 156 364
             C 182 384, 214 396, 248 396
             C 278 396, 298 384, 298 364
             C 298 344, 280 330, 242 318
             L 172 294
             C 126 278, 96 250, 96 208
             C 96 154, 138 114, 212 100
             C 258 92, 312 98, 350 114
             Z" 
          fill="url(#carbonMetal)" 
          stroke="url(#shaktiAmber)" 
          stroke-width="3" />

    <!-- Foreground Dynamic Lightning "Shakti" Bolt slice integrated through the "S" -->
    <path d="M 284 102
             L 168 250
             L 238 250
             L 194 402
             L 340 236
             L 264 236
             Z" 
          fill="url(#energyGlow)" 
          opacity="0.95" />

    <!-- Sleek Power Accent Blade Top -->
    <path d="M 220 100
             C 270 94, 320 106, 356 128
             L 334 168
             C 304 148, 268 138, 228 142
             Z" 
          fill="url(#shaktiAmber)" />

    <!-- Sleek Power Accent Blade Bottom -->
    <path d="M 292 412
             C 242 418, 192 406, 156 384
             L 178 344
             C 208 364, 244 374, 284 370
             Z" 
          fill="url(#shaktiAmber)" />

    <!-- Core Dynamic Energy Spark Dot (Precision Node) -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#glowDrop)" />
  </g>
</svg>

