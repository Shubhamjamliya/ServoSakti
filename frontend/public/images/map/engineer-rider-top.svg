<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Live-map marker: service engineer on a scooter seen from above, travelling UP (north). The map rotates it to the
       direction of travel around its centre (40, 40). Yellow hard hat, orange hi-vis vest, red toolbox at the back. -->
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0b1324" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- tyres -->
    <rect x="37" y="4" width="6" height="13" rx="3" fill="#1f2937"/>
    <rect x="37" y="63" width="6" height="13" rx="3" fill="#1f2937"/>
    <!-- scooter body -->
    <rect x="31" y="12" width="18" height="54" rx="9" fill="#1456d8"/>
    <path d="M34 18 C35 15 37.5 13.5 40 13.5 C42.5 13.5 45 15 46 18" fill="none" stroke="#5b8def" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="40" cy="13.8" rx="3" ry="1.6" fill="#fde68a"/>
    <!-- handlebar with mirrors -->
    <rect x="24" y="20" width="32" height="3.6" rx="1.8" fill="#1f2937"/>
    <circle cx="25.5" cy="18.6" r="2" fill="#94a3b8"/>
    <circle cx="54.5" cy="18.6" r="2" fill="#94a3b8"/>
    <!-- toolbox on the rear carrier -->
    <rect x="28.5" y="53" width="23" height="18" rx="3" fill="#dc2626"/>
    <rect x="28.5" y="53" width="23" height="4" rx="2" fill="#b91c1c"/>
    <rect x="35" y="60" width="10" height="3.2" rx="1.6" fill="#1f2937"/>
    <rect x="38.2" y="66.2" width="3.6" height="2.6" rx="0.8" fill="#fbbf24"/>
    <!-- knees -->
    <ellipse cx="32.2" cy="43" rx="3.4" ry="4.6" fill="#1e3a8a"/>
    <ellipse cx="47.8" cy="43" rx="3.4" ry="4.6" fill="#1e3a8a"/>
    <!-- arms (blue sleeves) reaching the grips, orange gloves -->
    <path d="M31 36 L27 23" stroke="#2f6fe8" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M49 36 L53 23" stroke="#2f6fe8" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="27" cy="22.2" r="2.6" fill="#f59e0b"/>
    <circle cx="53" cy="22.2" r="2.6" fill="#f59e0b"/>
    <!-- shoulders + back: orange hi-vis vest with reflective stripes -->
    <ellipse cx="40" cy="42" rx="11" ry="8.5" fill="#f97316"/>
    <path d="M30.5 44.5 H49.5" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M35 34.8 V49.8 M45 34.8 V49.8" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round"/>
    <!-- yellow hard hat (brim + dome + ridge) -->
    <circle cx="40" cy="36.5" r="8" fill="#eab308"/>
    <circle cx="40" cy="36" r="6.4" fill="#facc15"/>
    <path d="M40 29.8 V42.2" stroke="#eab308" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M36 33 C36.8 31.4 38 30.6 39 30.4" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
