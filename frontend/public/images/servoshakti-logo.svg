<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="markBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>

    <linearGradient id="shaktiAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleMarkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group: Emblem Mark (Left) -->
  <g transform="translate(20, 20)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#markBg)" stroke="#92400e" stroke-width="2.5" filter="url(#subtleMarkShadow)" />

    <!-- Tech dial line -->
    <circle cx="100" cy="100" r="76" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 7" opacity="0.4" />
    <circle cx="100" cy="100" r="84" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.25" />

    <!-- Precision Marks -->
    <line x1="100" y1="18" x2="100" y2="26" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="100" y1="174" x2="100" y2="182" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="18" y1="100" x2="26" y2="100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="174" y1="100" x2="182" y2="100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Mechanical Wing "S" Silhouette -->
    <path d="M 134 56
             C 120 50, 94 48, 76 54
             C 56 60, 46 75, 46 92
             C 46 108, 56 119, 78 126
             L 112 137
             C 131 143, 140 152, 140 164
             C 140 182, 122 192, 98 192
             C 82 192, 64 186, 50 176
             L 56 158
             C 68 167, 82 172, 98 172
             C 112 172, 120 166, 120 158
             C 120 148, 112 142, 94 136
             L 62 125
             C 42 118, 28 105, 28 86
             C 28 62, 48 44, 82 38
             C 102 34, 126 37, 142 45
             Z" 
          fill="#1c1611" 
          stroke="url(#shaktiAmberGrad)" 
          stroke-width="1.8" />

    <!-- Central Shakti Lightning Energy Bolt -->
    <path d="M 116 42
             L 62 108
             L 94 108
             L 74 176
             L 142 98
             L 106 98
             Z" 
          fill="url(#boltGrad)" 
          filter="url(#markGlow)" />
  </g>

  <!-- Group: Typography (Right) -->
  <g transform="translate(250, 0)">
    <!-- "SERVO" -->
    <text x="0" y="118" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#1c1917">SERVO</text>

    <!-- "SHAKTI" -->
    <text x="312" y="118" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, sans-serif" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="2" 
          fill="url(#textGrad)">SHAKTI</text>

    <!-- Subtitle / Tagline pill badge -->
    <rect x="2" y="146" width="370" height="34" rx="17" fill="#92400e" fill-opacity="0.1" stroke="#92400e" stroke-opacity="0.3" stroke-width="1.2" />

    <text x="187" y="169" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#92400e">FIELDFORCE NETWORK</text>

    <!-- Technology circuit accent dot -->
    <circle cx="396" cy="163" r="4" fill="#f59e0b" />
    <line x1="406" y1="163" x2="480" y2="163" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  </g>
</svg>

